# Cấu hình deploy trên Railway (UAT / production).
# Pre-deploy: migrate schema, rồi seed demo nếu DB trống (không ghi đè data thật).

[build]
builder = "RAILPACK"

[deploy]
startCommand = "npm run start"
preDeployCommand = "npx prisma migrate deploy && npx prisma db seed"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopinbox
      POSTGRES_PASSWORD: shopinbox
      POSTGRES_DB: shopinbox
    ports:
      - "5433:5432"
    volumes:
      - shopinbox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopinbox -d shopinbox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shopinbox_pg:

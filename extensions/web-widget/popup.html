<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Nexo</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.45 system-ui, sans-serif;
        color: #134e4a;
        background: #f0fdfa;
      }
      main {
        padding: 12px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      p {
        margin: 0 0 8px;
        color: #5b7471;
      }
      .ok {
        color: #0f766e;
      }
      .warn {
        color: #b45309;
      }
      hr {
        border: 0;
        border-top: 1px solid #ccfbf1;
        margin: 10px 0;
      }
      button,
      a.btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 0;
        border-radius: 10px;
        background: #0d9488;
        color: #fff;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      button.secondary {
        background: #fff;
        color: #0f766e;
        box-shadow: inset 0 0 0 1px #99f6e4;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nexo</h1>
      <p id="status">Đang đọc tab…</p>
      <button id="openInbox" type="button">Mở Inbox</button>
      <button id="attachOrigin" class="secondary" type="button" hidden>Gắn tab Nexo này</button>
      <button id="confirm" class="secondary" type="button" hidden>Xác nhận gắn chat website</button>
      <hr />
      <button id="connect" class="secondary" type="button" hidden>Nối domain trang này</button>
      <button id="inject" type="button" hidden>Hiện nút Chat trên trang này</button>
      <button id="copy" class="secondary" type="button" hidden>Copy snippet</button>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
